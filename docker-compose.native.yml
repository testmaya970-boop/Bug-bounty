services:
  sentinel-postgres:
    image: postgres:17-alpine
    container_name: sentinel_native_postgres
    restart: unless-stopped
    environment:
      # This becomes the cluster's bootstrap superuser (unavoidable -- POSTGRES_USER
      # always is), used only to run migrations/admin scripts, never the role the app
      # itself connects as. See db/init/01-app-role.sql: the app connects as
      # sentinel_app_runtime, a plain non-superuser, non-BYPASSRLS role, so RLS is
      # actually enforced locally exactly as it would be in production -- a superuser
      # connection silently bypasses RLS regardless of any SET ROLE, which defeated the
      # defense-in-depth design this migration relies on (found live: every row was
      # visible via plain SELECT with no role switch at all).
      POSTGRES_USER: sentinel_app
      # Secrets come from the gitignored .env next to this file (see .env.example), never
      # from this committed file. Compose refuses to start if they are missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sentinel
    # Loopback only: the database must never be reachable from the network.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sentinel_native_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  sentinel-minio:
    image: minio/minio:latest
    container_name: sentinel_native_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    # Loopback only. The app uses a scoped storage user (scripts/storage-app-user.sh), not
    # these root credentials.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - sentinel_native_minio:/data

volumes:
  sentinel_native_pgdata:
  sentinel_native_minio:
