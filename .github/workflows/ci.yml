name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres, so every push proves the schema still builds from an empty
    # database in filename order -- the check that catches an edited shipped migration.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel_app -d sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://sentinel_app:ci_password@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build the schema from scratch
        run: |
          PGPASSWORD=ci_password psql -h localhost -U sentinel_app -d sentinel -v ON_ERROR_STOP=1 -f db/init/01-app-role.sql
          npm run db:migrate
      - run: npm run check:rpc-args
      - run: npm test
      - run: npm run build

  # The AGENTS.md release gate, on every push: the full E2E suite against a real production
  # build (playwright.config.ts builds and starts it, plus the outbox worker) with a
  # from-scratch schema, a fresh bucket, and the deterministic seed. The latency budgets are
  # excluded -- shared CI runners are too noisy for a 20% rule; measure those locally.
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel_app -d sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci_minio -e MINIO_ROOT_PASSWORD=ci_minio_password minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
      - name: Write .env.local (the scripts and worker read it)
        run: |
          cat > .env.local <<ENV
          DATABASE_URL=postgres://sentinel_app_runtime:sentinel_dev_password@localhost:5432/sentinel
          MIGRATION_DATABASE_URL=postgres://sentinel_app:ci_password@localhost:5432/sentinel
          SESSION_COOKIE_SECRET=$(openssl rand -hex 32)
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=us-east-1
          S3_BUCKET=evidence
          S3_ACCESS_KEY_ID=ci_minio
          S3_SECRET_ACCESS_KEY=ci_minio_password
          S3_FORCE_PATH_STYLE=true
          EMAIL_PROVIDER=dev
          ENV
      - name: Schema, bucket, seed
        run: |
          PGPASSWORD=ci_password psql -h localhost -U sentinel_app -d sentinel -v ON_ERROR_STOP=1 -f db/init/01-app-role.sql
          npm run db:migrate
          npm run storage:init
          ALLOW_TEST_ACCOUNTS=1 npm run seed:e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert "latency budgets"
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "test-results/\nplaywright-report/", retention-days: 7 }
